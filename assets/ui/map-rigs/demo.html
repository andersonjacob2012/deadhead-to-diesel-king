<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DK map rigs: articulation demo</title>
<link rel="stylesheet" href="rigs.css"><script src="chicken.js"></script><style>
html,body{margin:0;height:100%;background:#141a26;font:13px Inter,system-ui,sans-serif;color:#9fb0c9;overflow:hidden}
#stage{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#1a2230,#0f141f)}
svg.road{position:absolute;inset:0;width:100%;height:100%}
.ui{position:absolute;left:10px;top:10px;right:10px;z-index:10;display:flex;gap:6px;flex-wrap:wrap}
.ui button{background:#1a2843;color:#ffd84d;border:1px solid #46587a;border-radius:8px;padding:6px 10px;font:700 12px inherit;cursor:pointer}
.ui button.on{background:#ffd84d;color:#1a1300}
</style></head><body><div id="stage"><svg class="road"><path id="road" fill="none" stroke="#2a3245" stroke-width="14" stroke-linecap="round"/><path id="road2" fill="none" stroke="#ffd84d" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="8 10"/></svg></div>
<div class="ui"><button data-c="dk-rig--night">Night</button><button data-c="dk-rig--lights-off">Lights off</button><button data-c="dk-rig--reduced">Reduced FX</button><button id="sel">Selected</button><button id="mk">Make: ironcrest</button><button id="zm">Size: 40px</button><button id="pz">Pause</button><button id="md">Follow: path</button><button id="tg">Curve: normal</button></div>
<div class="ui" id="pal" style="top:auto;bottom:10px"></div>
<script>
// ---- spec (mirrors rigs.json) ----
const U_FRONT=79, U_KP2AX=154;              // tractor front->kingpin, trailer kingpin->rear axle (SVG units)
const MAKES=['ironcrest','bannerline','highvale'];
const P=new URLSearchParams(location.search);
let tight=P.has('tight'),mode=P.get('mode')||'path',make=P.get('make')||'ironcrest', sel=P.has('sel'), tractorPx=+(P.get('px')||40), paused=P.has('t');
const stage=document.getElementById('stage');
// ---- rig DOM: 6 layers in one container ----
const rig=document.createElement('div');rig.className='dk-rig'+(P.has('night')?' dk-rig--night':'');stage.appendChild(rig);
const L={};[['ring',null],['trailer','trailer-53.svg'],['lchick',null],['llights','trailer-lights.svg'],['beams','tractor-beams.svg'],['tractor',''],['tchick',null],['tlights','tractor-lights.svg']].forEach(([k,f])=>{let e;
 if(f===null&&k=='ring'){e=document.createElement('div')}else{e=new Image();e.alt='';if(f)e.src=f}  // chicken layers are <img> with blob URLs (see ckURL)
 e.className='dk-rig__'+k;rig.appendChild(e);L[k]=e});
let pal=P.get('pal')||'amber';
function skin(){L.tractor.src=`tractor-${make}.svg`;rig.classList.toggle('dk-rig--selected',sel);rig.style.setProperty('--u',(tractorPx/96)+'px');
 PALS.forEach(p=>rig.classList.remove('dk-ck--'+p));rig.classList.add('dk-ck--'+pal);
 const col=getComputedStyle(rig).getPropertyValue('--dk-chicken').trim()||'#ffb020',still=rig.classList.contains('dk-rig--reduced')||matchMedia('(prefers-reduced-motion:reduce)').matches;
 L.tchick.src=ckURL('tractor',pal,col,still);L.lchick.src=ckURL('trailer',pal,col,still)}
// chicken lights: <img> from a cached blob URL per part/palette (inline <svg> repainted every frame, ~20 fps). Color + chase are baked into the SVG.
const CKU={};function ckURL(part,id,color,still){const k=[part,id,color,still?1:0].join();if(CKU[k])return CKU[k];let v=DK_CHICKEN[part];
 if(id=='chase')v=v.replace(/(<svg[^>]*>)/,'$1<style>.ck{color:hsl(calc(var(--i)*37) 100% 62%)}'+(still?'':'.ck{animation:c 1.4s linear infinite;animation-delay:calc(var(--i)*-.07s)}@keyframes c{0%,100%{opacity:1}50%{opacity:.25}}')+'</style>');
 else v=v.replace(/color="[^"]*"/,'color="'+color+'"');
 return CKU[k]=URL.createObjectURL(new Blob([v],{type:'image/svg+xml'}))}
const pal_el=document.getElementById('pal');const PALS=['amber','red','blue','green','purple','white','chase'];
skin();
// ---- path: closed wavy loop, sampled by arc length ----
let pts=[],len=0;
function buildPath(){const w=innerWidth,h=innerHeight,cx=w/2,cy=h/2,rx=Math.min(w,h*1.3)*.36,ry=Math.min(h,w)*.32;pts=[];len=0;let prev=null;
 for(let i=0;i<=1200;i++){const t=i/1200*Math.PI*2,k=tight?.34:.18,x=cx+rx*Math.cos(t)+rx*k*Math.cos(3*t)+(tight?rx*.12*Math.cos(5*t):0),y=cy+ry*Math.sin(t)+ry*(tight?.3:.22)*Math.sin(2*t)+(tight?ry*.14*Math.sin(5*t):0);if(prev)len+=Math.hypot(x-prev[0],y-prev[1]);pts.push([x,y,len]);prev=[x,y]}
 const d='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L');road.setAttribute('d',d);road2.setAttribute('d',d)}
function pointAtDistanceBehindWrap(s,L){ // demo-only: the loop is closed, so search in a doubled copy
 const ext=pts.map(p=>[p[0],p[1],p[2]]).concat(pts.slice(1).map(p=>[p[0],p[1],p[2]+len]));const r=pointAtDistanceBehindOn(ext,s+len,L);if(!r)return null;r.s=((r.s%len)+len)%len;return r}
function pointAtDistanceBehindOn(arr,s,L){const save=pts;pts=arr;const r=pointAtDistanceBehind(arr,s,L);pts=save;return r}
function at(s){const T=pts[pts.length-1][2];s=((s%T)+T)%T;let lo=0,hi=pts.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(pts[m][2]<s)lo=m;else hi=m}const a=pts[lo],b=pts[hi],f=(s-a[2])/((b[2]-a[2])||1);return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}
// ---- kinematic follow (copy this) ----
let K=null,A=null;
const bearing=(from,to)=>Math.atan2(to[0]-from[0],-(to[1]-from[1]))*180/Math.PI; // 0 = north, clockwise
function follow(prev,lead,dist){const dx=lead[0]-prev[0],dy=lead[1]-prev[1],d=Math.hypot(dx,dy)||1;return[lead[0]-dx/d*dist,lead[1]-dy/d*dist]}
// ---- path-following (copy this): point on the polyline at Euclidean distance L behind arc position s ----
// pts: [[x,y,cum],...] with cumulative arc length in [2]. Returns {x,y,s} or null if the route start is reached.
function pointAtDistanceBehind(pts,s,L){
 let i=idxAt(s); const P0=at(s); let px=P0[0],py=P0[1];
 for(let j=i;j>=0;j--){const B=pts[j];                      // segment from (current) back to B
  if(Math.hypot(B[0]-P0[0],B[1]-P0[1])>=L){                   // the circle |X-P0|=L crosses segment [B,(px,py)]
   const dx=px-B[0],dy=py-B[1],fx=B[0]-P0[0],fy=B[1]-P0[1];
   const a=dx*dx+dy*dy,b=2*(fx*dx+fy*dy),c=fx*fx+fy*fy-L*L,disc=Math.max(0,b*b-4*a*c);
   const t=a?(-b-Math.sqrt(disc))/(2*a):0;                     // smaller root: the crossing toward B (farther back); +root lies past t=1. Matches pab() in index.html
   const tt=Math.min(1,Math.max(0,t)); const x=B[0]+dx*tt,y=B[1]+dy*tt;
   const segLen=Math.hypot(dx,dy);return{x,y,s:B[2]+segLen*tt}}
  px=B[0];py=B[1]}
 return null}
function idxAt(s){let lo=0,hi=pts.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(pts[m][2]<=s)lo=m;else hi=m}return lo}
function step(s){const u=tractorPx/96;s=((s%len)+len)%len;const F=at(s);
 if(!K){K=at(s-U_FRONT*u);A=at(s-(U_FRONT+U_KP2AX)*u)}
 if(mode=='path'){
  // closed demo loop: unwrap by searching from s+len when near the start
  let k=pointAtDistanceBehind(pts,s,U_FRONT*u)||pointAtDistanceBehindWrap(s,U_FRONT*u);
  let a=k&&(pointAtDistanceBehind(pts,k.s,U_KP2AX*u)||pointAtDistanceBehindWrap(k.s,U_KP2AX*u));
  K=k?[k.x,k.y]:follow(K,F,U_FRONT*u); A=a?[a.x,a.y]:follow(A,K,U_KP2AX*u);
 }else{K=follow(K,F,U_FRONT*u); A=follow(A,K,U_KP2AX*u)}
 const ht=bearing(K,F), hl=bearing(A,K), kx=Math.round(K[0]*2)/2, ky=Math.round(K[1]*2)/2;
 const tT=`translate(${kx}px,${ky}px) rotate(${ht.toFixed(1)}deg)`, tL=`translate(${kx}px,${ky}px) rotate(${hl.toFixed(1)}deg)`;
 L.tractor.style.transform=L.tlights.style.transform=L.beams.style.transform=L.tchick.style.transform=L.ring.style.transform=tT;
 L.trailer.style.transform=L.llights.style.transform=L.lchick.style.transform=tL}
let s=0,last=performance.now();
function warm(){K=A=null;for(let i=0;i<300;i++)step(s-(300-i)*2);step(s)}
function init(){const f=len?s/len:+(P.get('t')||0);buildPath();s=f*len;warm()}
init();addEventListener('resize',init);
function loop(now){const dt=Math.min(50,now-last);last=now;if(!paused){s+=dt*.09;step(s)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
// ---- UI ----
document.querySelectorAll('[data-c]').forEach(b=>{if(rig.classList.contains(b.dataset.c))b.classList.add('on');b.onclick=()=>{rig.classList.toggle(b.dataset.c);b.classList.toggle('on');skin()}});
document.getElementById('sel').onclick=e=>{sel=!sel;e.target.classList.toggle('on',sel);skin()};
md.onclick=()=>{mode=mode=='path'?'kin':'path';md.textContent='Follow: '+(mode=='path'?'path':'kinematic');warm()};
tg.onclick=()=>{tight=!tight;tg.textContent='Curve: '+(tight?'tight':'normal');init()};
PALS.forEach(p=>{const b=document.createElement('button');b.textContent=p;b.onclick=()=>{pal=p;skin();[...pal_el.children].forEach(c=>c.classList.toggle('on',c==b))};if(p==pal)b.classList.add('on');pal_el.appendChild(b)});
mk.onclick=()=>{make=MAKES[(MAKES.indexOf(make)+1)%3];mk.textContent='Make: '+make;skin()};
zm.onclick=()=>{tractorPx=tractorPx==40?52:tractorPx==52?30:40;zm.textContent='Size: '+tractorPx+'px';skin();warm()};
pz.onclick=()=>{paused=!paused;pz.classList.toggle('on',paused)};
if(P.has('noui'))document.querySelectorAll('.ui').forEach(e=>e.style.display='none');
if(P.has('sel'))document.getElementById('sel').classList.add('on');md.textContent='Follow: '+(mode=='path'?'path':'kinematic');tg.textContent='Curve: '+(tight?'tight':'normal');
</script></body></html>
