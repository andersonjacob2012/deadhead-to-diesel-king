body{margin:0;background:#05080f;font-family:var(--dk-font)}
.scr{width:390px;height:844px;margin:0 auto;position:relative;overflow:hidden;color:var(--dk-tx)}
.hud{display:flex;gap:8px;align-items:center;padding:14px 12px 10px;background:linear-gradient(#0b1220,rgba(11,18,32,.85))}
.lv{width:52px;height:52px;border-radius:50%;background:var(--dk-surf);box-shadow:0 0 0 3px var(--dk-gold-lo),inset 0 0 0 3px var(--dk-good);display:grid;place-items:center;position:relative;font:800 18px var(--dk-font)}

.wrap{padding:8px 12px;display:flex;flex-direction:column;gap:10px}
.mini{width:14px!important;height:14px!important;vertical-align:-2px}
nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#0b1220;box-shadow:0 -1px 0 var(--dk-gold-lo);padding:6px 4px 18px}
nav button{flex:1;background:none;border:0;color:var(--dk-tx3);font:700 10.5px var(--dk-font);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:10px}
nav button .dk-ico{color:currentColor;width:22px;height:22px} nav .on{color:var(--dk-gold);background:var(--dk-surf2)}
.dk-banner{animation:none;position:absolute;top:300px}
