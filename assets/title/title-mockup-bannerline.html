<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deadhead to Diesel King — title mockup (bannerline)</title><style>
html,body{margin:0;height:100%;background:#0b1220;font-family:Inter,system-ui,-apple-system,sans-serif}
#title{position:relative;width:100%;max-width:390px;height:844px;max-height:100vh;margin:0 auto;overflow:hidden;background:#0b1220 url(hero-bannerline-painted.webp) 22% 100%/auto 640px no-repeat;display:flex;flex-direction:column;align-items:center;color:#e8eef8;text-align:center}
#title:before{content:"";position:absolute;inset:0;background:linear-gradient(#0b1220 0%,#0b1220 26%,rgba(11,18,32,.75) 36%,rgba(11,18,32,.2) 48%,rgba(11,18,32,0) 55%,rgba(11,18,32,0) 72%,rgba(11,18,32,.9) 90%,#0b1220)}
#title>*{position:relative}
.logo{width:min(340px,86vw);margin-top:56px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.7))}
.tag{margin:4px 28px 0;font-size:14px;color:#e8eef8;text-shadow:0 1px 4px #000}
.spacer{flex:1}
.b{background:linear-gradient(180deg,#ffe27a,#ffd84d);color:#1a1300;border:0;border-radius:12px;font-weight:800;font-size:20px;padding:14px 40px;box-shadow:0 3px 0 #b8942a,0 2px 8px rgba(0,0,0,.35);animation:p 1.6s ease-in-out infinite;cursor:pointer}

.foot{margin:14px 0 34px;font-size:11px;color:#9fb0c9;letter-spacing:.12em}
</style></head><body><div id="title">
<img class="logo" src="logo-stacked.svg" alt="Deadhead to Diesel King">
<p class="tag">53' dry van. One beat-up rig. Build a trucking empire.</p>
<div class="spacer"></div>
<button class="b">▶ Start Driving</button>
<div class="foot">TAP TO PLAY</div></div></body></html>
