<script>
var SUGGEST=['Deadhead Freight Co.','Diesel King Freight','Lonestar Haulers','Big Rig Logistics','Midnight Mile Transport','Hammer Lane Freight'];
// ---------- data ----------
const TOP=new Set(['SEA','LA','DEN','DAL','HOU','CHI','ATL','NYC','MIA','MSP','PHX','SLC','KC']),CITIES=CITY_LL,HUB=new Set(HUBS),BIG=new Set(['SEA','LA','SFO','PHX','DEN','DAL','HOU','KC','CHI','ATL','NYC','MIA','MSP','SLC','ELP','MEM','JAX','BOS','CLT']); // key -> [lat,lng,name]
const TYPES={dry:{n:"53' Dry Van",e:'📦',m:1},reefer:{n:'Reefer',e:'❄️',m:1.3},flat:{n:'Flatbed',e:'🪵',m:1.2}};
const ENABLED_TYPES=['dry']; // add 'reefer','flat' later
const HR=0.5;            // real seconds per game hour
const SPEED=60/HR;       // miles per real second (60 mph)
const fmt=n=>(n<0?'−':'')+'$'+(Math.abs(n)>=1e6?(Math.abs(n)/1e6).toFixed(2)+'M':Math.abs(n)>=1e4?(Math.abs(n)/1e3).toFixed(1)+'K':Math.floor(Math.abs(n)).toLocaleString());
const fmtC=n=>{const a=Math.abs(n),s=n<0?'−$':'$';return a>=1e9?s+(a/1e9).toFixed(a<1e10?1:0)+'B':a>=1e6?s+(a/1e6).toFixed(a<1e7?1:0)+'M':a>=1e4?s+(a/1e3).toFixed(0)+'K':s+Math.floor(a).toLocaleString()};
const rid=()=>Math.random().toString(36).slice(2,7), rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];
const RC={};
const ADJ={};for(const k in ROUTES){const[a,b]=k.split('-');(ADJ[a]=ADJ[a]||[]).push([b,ROUTES[k].mi]);(ADJ[b]=ADJ[b]||[]).push([a,ROUTES[k].mi])}
const PT={};function path(a,b){let T=PT[a];if(!T){const D={[a]:0},P={},Q=new Set([a]),done=new Set();while(Q.size){let u=null;for(const x of Q)if(u==null||D[x]<D[u])u=x;Q.delete(u);done.add(u);for(const[v,m]of ADJ[u]||[]){if(done.has(v))continue;const d=D[u]+m;if(D[v]==null||d<D[v]){D[v]=d;P[v]=u;Q.add(v)}}}T=PT[a]={D,P}}
 if(T.D[b]==null)return null;const p=[b];while(p[0]!=a)p.unshift(T.P[p[0]]);return p}
function raw(a,b){let r=ROUTES[a+'-'+b];if(r)return{mi:r.mi,via:r.via,pts:r.pts};r=ROUTES[b+'-'+a];if(r)return{mi:r.mi,via:r.via,pts:r.pts.slice().reverse()};return null}
function route(a,b){const k=a+'-'+b;if(RC[k])return RC[k];let r=raw(a,b);
 if(!r){const p=path(a,b);if(p){r={mi:0,via:[],pts:[]};for(let i=1;i<p.length;i++){const s=raw(p[i-1],p[i]);r.mi+=s.mi;for(const v of s.via)if(!r.via.includes(v))r.via.push(v);r.pts.push(...(i>1?s.pts.slice(1):s.pts))}r.via=r.via.slice(0,4)}
  else{const A=CITIES[a],B=CITIES[b];r={mi:Math.round(Math.hypot(A[0]-B[0],(A[1]-B[1])*.8)*69*1.2),via:[],pts:[[A[0],A[1]],[B[0],B[1]]]}}}
 const pts=r.pts,cum=[0];for(let i=1;i<pts.length;i++){const[y1,x1]=pts[i-1],[y2,x2]=pts[i];cum.push(cum[i-1]+Math.hypot(y2-y1,(x2-x1)*Math.cos(y1*Math.PI/180)))}
 return RC[k]={mi:r.mi,via:r.via,pts,cum}}
const dist=(a,b)=>a==b?0:route(a,b).mi;
function along(r,f){f=Math.max(0,Math.min(1,f));const L=r.cum[r.cum.length-1]*f;let i=1;while(i<r.cum.length-1&&r.cum[i]<L)i++;const s=r.cum[i]-r.cum[i-1]||1,u=(L-r.cum[i-1])/s,p=r.pts[i-1],q=r.pts[i];return[p[0]+(q[0]-p[0])*u,p[1]+(q[1]-p[1])*u]}
const viaHtml=v=>(v&&v.length?v.map(x=>`<span class="i">${x}</span>`).join(''):'<span class="sm">US highways</span>');
const hhmm=h=>{h=((h%24)+24)%24;return String(Math.floor(h)).padStart(2,'0')+':'+(h%1<.5?'00':'30')};
// ---------- state ----------
let S;
function newState(){return{v:2,v6:1,lanes:[],heat:0,safety:100,cash:34000,trucks:[],jobs:[],earned:0,last:Date.now(),fuel:6.18,clock:6}}
function mkTruck(c){return{id:rid(),name:'Rig #'+(S.trucks.length+1),at:c,job:null,prog:0,phase:'idle',rest:0,hos:0,auto:false,up:{fuel:0,speed:0,cap:0},cond:100,policy:'ask',type:'dry'}}
function genJob(from){const k=Object.keys(CITIES).filter(unlocked),f=from||pick(k);let t;const nb=(ADJ[f]||[]).map(x=>x[0]).filter(unlocked);if(nb.length&&Math.random()<.7)t=pick(nb);else{const F=CITIES[f],far=k.filter(c=>c!=f&&Math.hypot(CITIES[c][0]-F[0],(CITIES[c][1]-F[1])*.8)*69<1300);do t=pick(far.length?far:k);while(t==f)}
 const ty=pick(ENABLED_TYPES),r=route(f,t),mi=r.mi,w=Math.round(rnd(18,45))*1000;
 const rpm=rnd(1.95,2.6)*(mi<400?1.25:1)*TYPES[ty].m*(1+(w-30000)/300000);
 return{id:rid(),from:f,to:t,type:ty,miles:mi,via:r.via,w,pay:Math.round(Math.max(mi*rpm,minLoad(mi)*rpm/2.3))}}
const HOT_EVERY=3600e3;
function genHot(flash){const j=genJob();const m=flash?rnd(1.6,1.9):rnd(1.35,1.75);return{...j,id:'h'+rid(),pay:Math.round(j.pay*m),mult:m,hot:true,flash:!!flash,exp:Date.now()+(flash?rnd(30,60)*1e3:rnd(40,170)*60e3)}}
function hotUpkeep(){const now=Date.now();if(!S.hot)S.hot={next:0,loads:[]};
 if(now>=S.hot.next){S.hot.loads=S.hot.loads.filter(l=>l.exp>now);let n=0;while(S.hot.loads.filter(l=>!l.flash).length<5){S.hot.loads.push(genHot());n++}S.hot.next=now+HOT_EVERY*(S.next0?1:.25);S.next0=1;if(!offline&&S.started&&n)say(`🔥 Hot Sheet refreshed — ${n} new premium load${n>1?'s':''}!`)}
 const before=S.hot.loads.length;S.hot.loads=S.hot.loads.filter(l=>l.exp>now);return before!=S.hot.loads.length}
const cd=ms=>{ms=Math.max(0,ms/1000|0);const h=ms/3600|0,m=(ms%3600)/60|0,s=ms%60;return(h?h+'h ':'')+(h||m?m+'m ':'')+s+'s'};
/* ECONOMY — real US dry van numbers (checked 2026-10-16):
 - DAT national dry van spot, week Oct 4-10 2026: $2.26/mi linehaul, $3.12/mi all-in incl. fuel surcharge (dat.com/blog dry van report 2026-10-13; ajot.com DAT weekly report)
 - EIA U.S. on-highway diesel, week of 2026-10-12: $6.179/gal (eia.gov/petroleum/gasdiesel). FSC uses DOE-style (diesel-$1.25)/6 mpg ≈ $0.82/mi, matching DAT's $0.83-0.86 surcharge.
 - ATRI Operational Costs of Trucking 2026 update (2025 data): R&M $0.215/mi, insurance $0.106/mi, driver wages $0.818/mi (+$0.21 benefits), truck/trailer payments $0.404/mi, avg ~6.5-7 mpg.
 - FMCSA 49 CFR 386 App. A/B (2025 inflation adj.): OOS-order violations up to $2,364 (driver) / $23,647 (carrier); roadside fines in game kept at $1K-$5K + 48h OOS.
 - Equipment: used day-cab/sleeper tractors ~$40-80K, new ~$150-180K; 53' dry van trailer new ~$35-50K, used ~$12-20K.
 Player = carrier/owner. Load pay = gross linehaul + FSC. Hired drivers cost $0.62/mi; when you dispatch a truck yourself it's owner-operated (no driver wage).
 Game clock is accelerated (1 game-hour = 0.5 s) so per-day figures are shown in game days. */
const minLoad=mi=>375+1.1*mi; // brokers' local/short-haul minimum charge (~$350-450 per load)
const MAINT=.20,FIXED_DAY=165,DRIVER_RPM=.62,fsc=mi=>mi*Math.max(0,(S.fuel||6.18)-1.25)/6,DAY=24*0.5;
const LANE_RPM=2.25,LANE_OFF=.75,laneRpm=mi=>LANE_RPM*(mi<300?1.35:mi<600?1.15:1);
const DOCK_H=2;
const tripSec=(mi,spd=SPEED)=>mi/spd+2*DOCK_H*HR+mi/660*10*HR+.5*2+.6; // drive + 2 fixed 2h docks + prorated HOS breaks + avg scale stop
const XPT=[0,1500,6500,18000,38000,70000];for(let i=6;i<60;i++)XPT.push(XPT[i-1]+8000+2000*(i-5));
const level=()=>{const x=S.xp||0;let l=1;while(l<XPT.length&&x>=XPT[l])l++;return l}, lvFrac=()=>{const l=level();return((S.xp||0)-XPT[l-1])/(XPT[l]-XPT[l-1])};
const REGN=['South Central','Midwest','Southeast','Mountain West','Northeast','West Coast'];
const region=c=>{const[la,ln]=CITIES[c];if(la<37.2&&ln>-106.8&&ln<-89.5)return 0;if(la>=36.5&&ln>-104.5&&ln<-80.5)return 1;if(la<36.5&&ln>=-89.5)return 2;if(ln<-104.5&&ln>=-117.3)return 3;if(ln>=-80.5)return 4;return 5};
const gcDal=c=>{const A=CITIES[c],B=CITIES.DAL;return Math.hypot(A[0]-B[0],(A[1]-B[1])*Math.cos(A[0]*Math.PI/180))*69};
function unlocked(c){return region(c)<level()||(S.lanes||[]).some(l=>l.a==c||l.b==c)||(S.trucks||[]).some(t=>t.at==c||(t.job&&(t.job.from==c||t.job.to==c)))}
const CO=k=>(S.co&&S.co[k])||0, coCost=k=>Math.round({office:15e3,safety:6e3,fuel:3e3}[k]*Math.pow(2.5,CO(k)));
const fuelMul=()=>Math.pow(.92,CO('fuel')), officeMul=()=>1+.08*CO('office'), safeMul=()=>.7+.3*(S.safety??100)/100;
const laneR=l=>route(l.a,l.b);
function laneEst(a,b){const mi=dist(a,b),sec=tripSec(mi),gross=Math.max(mi*laneRpm(mi),minLoad(mi))*1.007*officeMul(),net=gross+fsc(mi)-mi/6.47*(S.fuel||6.18)*fuelMul()-mi*(MAINT+DRIVER_RPM)-FIXED_DAY*sec/DAY;const perHr=Math.round(net*3600/sec*.93);return{mi,net:Math.round(net),perHr,perDay:Math.round(perHr/3600*DAY),price:Math.max(8e3,Math.round(perHr*1.5*Math.pow(1.15,(S.lanes||[]).length)/500)*500)}}
function laneJob(t,l){const to=t.at==l.a?l.b:t.at==l.b?l.a:l.b,from=to==l.b?l.a:l.b,r=route(from,to),w=Math.round(rnd(20,44))*1000;return{id:'L'+rid(),from,to,type:'dry',miles:r.mi,via:r.via,w,pay:Math.round(Math.max(r.mi*laneRpm(r.mi),minLoad(r.mi))*(1+(w-30000)/300000)*officeMul()),lane:l.id}}
function buyLane(a,b){const e=laneEst(a,b);if(S.cash<e.price)return;S.cash-=e.price;const l={id:rid(),a,b,truck:null};S.lanes.push(l);const fr=S.trucks.find(t=>!t.lane&&t.phase=='idle')||S.trucks.find(t=>!t.lane);if(fr){assignLane(l.id,fr.id)}else toast(`🔁 Lane ${CITIES[a][2]} ⇄ ${CITIES[b][2]} is yours! Assign a truck.`);drawLanes();render()}
function assignLane(lid,tid){const l=S.lanes.find(x=>x.id==lid);if(l.truck){const o=S.trucks.find(x=>x.id==l.truck);if(o)o.lane=null}l.truck=null;if(tid){const t=S.trucks.find(x=>x.id==tid);if(t.lane){const ol=S.lanes.find(x=>x.id==t.lane);if(ol)ol.truck=null}t.lane=lid;l.truck=tid;if((t.policy||'ask')=='ask')t.policy='pull';toast(`🚚 ${t.name} now runs ${CITIES[l.a][2]} ⇄ ${CITIES[l.b][2]} forever`)}render()}

const repCost=t=>Math.round((100-(t.cond??100))*40);function rep(id){const t=S.trucks.find(x=>x.id==id),c=repCost(t);if(S.cash<c)return;S.cash-=c;t.cond=100;render()}

function buyTruck(){const c=truckCost();if(S.cash<c)return;S.cash-=c;S.trucks.push(mkTruck('DAL'));toast('🎉 New rig added to your fleet!');render()}
function hire(id){if(S.cash<driverCost())return;S.cash-=driverCost();S.trucks.find(t=>t.id==id).auto=true;toast('🤖 Driver hired — this truck books its own loads');render()}
function upg(id,k){const t=S.trucks.find(t=>t.id==id),c=upCost(t,k);if(S.cash<c)return;S.cash-=c;t.up[k]++;render()}
