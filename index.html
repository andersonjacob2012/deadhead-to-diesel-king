const PT={};function path(a,b){let T=PT[a];if(!T){const D={[a]:0},P={},Q=new Set([a]),done=new Set();while(Q.size){let u=null;for(const x of Q)if(u==null||D[x]<D[u])u=x;Q.delete(u);done.add(u);for(const[v,m]of ADJ[u]||[]){if(done.has(v))continue;const d=D[u]+m;if(D[v]==null||d<D[v]){D[v]=d;P[v]=u;Q.add(v)}}}T=PT[a]={D,P}}
 if(T.D[b]==null)return null;const p=[b];while(p[0]!=a)p.unshift(T.P[p[0]]);return p}

function route(a,b){const k=a+'-'+b;if(RC[k])return RC[k];let r=raw(a,b);
 if(!r){const p=path(a,b);if(p){r={mi:0,via:[],pts:[]};for(let i=1;i<p.length;i++){const s=raw(p[i-1],p[i]);r.mi+=s.mi;for(const v of s.via)if(!r.via.includes(v))r.via.push(v);r.pts.push(...(i>1?s.pts.slice(1):s.pts))}r.via=r.via.slice(0,4)}
  else{const A=CITIES[a],B=CITIES[b];r={mi:Math.round(Math.hypot(A[0]-B[0],(A[1]-B[1])*.8)*69*1.2),via:[],pts:[[A[0],A[1]],[B[0],B[1]]]}}}
 const pts=r.pts,cum=[0];for(let i=1;i<pts.length;i++){const[y1,x1]=pts[i-1],[y2,x2]=pts[i];cum.push(cum[i-1]+Math.hypot(y2-y1,(x2-x1)*Math.cos(y1*Math.PI/180)))}

const repCost=t=>Math.round((100-(t.cond??100))*40);function rep(id){const t=S.trucks.find(x=>x.id==id),c=repCost(t);if(S.cash<c)return;S.cash-=c;t.cond=100;render()}
function coBuy(k){const c=coCost(k);if(S.cash<c)return;S.cash-=c;S.lt.buyU+=c;S.co=S.co||{};S.co[k]=CO(k)+1;toast('🏢 Company upgrade purchased!');render()}
function buyTruck(){const c=truckCost();if(S.cash<c)return;S.cash-=c;S.lt.buyT+=c;S.trucks.push(mkTruck('DAL'));toast('🎉 New rig added to your fleet!');ctEv('truck');render()}
function hire(id){if(S.cash<driverCost())return;S.lt.buyU+=driverCost();S.cash-=driverCost();S.trucks.find(t=>t.id==id).auto=true;ctEv('hire');toast('🤖 Driver hired — this truck books its own loads');render()}
function upg(id,k){const t=S.trucks.find(t=>t.id==id),c=upCost(t,k);if(S.cash<c)return;S.cash-=c;S.lt.buyU+=c;t.up[k]++;render()}
