<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Deadhead to Diesel King</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="routes.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#1b1f2a;color:#eee;max-width:520px;margin:auto;user-select:none}
header{position:sticky;top:0;background:#11141c;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;z-index:1001;border-bottom:2px solid #f5a623}
#cash{font-size:24px;font-weight:800;color:#7CFC7C}#rate{font-size:12px;color:#aaa}
#map{height:46vh;min-height:280px;background:#0b1a2a}
.truck{font-size:22px;line-height:22px;text-align:center;filter:drop-shadow(0 0 2px #000)}.truck.f{font-size:28px;filter:drop-shadow(0 0 4px #f5a623)}
.leaflet-tooltip.city{background:#11141ccc;color:#fff;border:0;font-weight:700;font-size:11px;padding:1px 5px;box-shadow:none}.leaflet-tooltip.city:before{display:none}
nav{display:flex;position:sticky;top:52px;z-index:1000}nav button{flex:1;padding:10px;background:#252b3a;color:#ccc;border:0;font-size:14px}nav button.on{background:#f5a623;color:#111;font-weight:700}
section{padding:8px}.card{background:#252b3a;border-radius:10px;padding:10px;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px}
button.b{background:#f5a623;border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px}button.b:disabled{opacity:.4}button.g{background:#555;color:#eee}
.bar{height:8px;background:#111;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#7CFC7C}
.sm{font-size:12px;color:#aaa}.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:#444;white-space:nowrap}.i{color:#fff;background:#1d5fbf;border-radius:4px;padding:0 4px;font-size:11px;font-weight:700;margin-right:2px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:10px;display:none;z-index:2000;max-width:90%}
.pop{position:fixed;color:#7CFC7C;font-weight:800;pointer-events:none;animation:up 1.2s forwards;z-index:2000;font-size:20px}@keyframes up{to{transform:translateY(-60px);opacity:0}}
</style></head><body>
<header><div><div id="cash">$0</div><div id="rate"></div></div><div style="text-align:right">👑 <b>Deadhead to Diesel King</b><div class="sm" id="lvl"></div></div></header>
<div id="map"></div>
<nav><button data-t="jobs" class="on">📋 Loads</button><button data-t="fleet">🚛 Fleet</button><button data-t="shop">🛒 Shop</button></nav>
<section id="panel"></section>
<div id="toast"></div><div id="modal" style="display:none;position:fixed;inset:0;background:#000a;z-index:1500;align-items:center;justify-content:center"></div>
<div id="title" style="position:fixed;inset:0;z-index:3000;background:linear-gradient(#11141c,#2a3b2e);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px"><div style="font-size:72px">🚚👑</div><h1 style="color:#f5a623;margin:10px 0">Deadhead to<br>Diesel King</h1><p class="sm">53' dry van. One beat-up rig. Build a trucking empire.</p><button class="b" style="font-size:20px;padding:14px 40px" onclick="this.parentNode.remove();map.invalidateSize()">▶ Start Driving</button></div>
<script>
// ---------- data ----------
const CITIES=CITY_LL; // key -> [lat,lng,name]
const TYPES={dry:{n:"53' Dry Van",e:'📦',m:1},reefer:{n:'Reefer',e:'❄️',m:1.3},flat:{n:'Flatbed',e:'🪵',m:1.2}};
const ENABLED_TYPES=['dry']; // add 'reefer','flat' later
const HR=0.5;            // real seconds per game hour
const SPEED=60/HR;       // miles per real second (60 mph)
const fmt=n=>(n<0?'−':'')+'$'+(Math.abs(n)>=1e6?(Math.abs(n)/1e6).toFixed(2)+'M':Math.abs(n)>=1e4?(Math.abs(n)/1e3).toFixed(1)+'K':Math.floor(Math.abs(n)).toLocaleString());
const rid=()=>Math.random().toString(36).slice(2,7), rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];
const RC={};
function route(a,b){const k=a+'-'+b;if(RC[k])return RC[k];let r=ROUTES[k],rev=false;if(!r){r=ROUTES[b+'-'+a];rev=true}
 const pts=rev?r.pts.slice().reverse():r.pts,cum=[0];for(let i=1;i<pts.length;i++){const[y1,x1]=pts[i-1],[y2,x2]=pts[i];cum.push(cum[i-1]+Math.hypot(y2-y1,(x2-x1)*Math.cos(y1*Math.PI/180)))}
 return RC[k]={mi:r.mi,via:r.via,pts,cum}}
const dist=(a,b)=>a==b?0:route(a,b).mi;
function along(r,f){f=Math.max(0,Math.min(1,f));const L=r.cum[r.cum.length-1]*f;let i=1;while(i<r.cum.length-1&&r.cum[i]<L)i++;const s=r.cum[i]-r.cum[i-1]||1,u=(L-r.cum[i-1])/s,p=r.pts[i-1],q=r.pts[i];return[p[0]+(q[0]-p[0])*u,p[1]+(q[1]-p[1])*u]}
const viaHtml=v=>(v&&v.length?v.map(x=>`<span class="i">${x}</span>`).join(''):'<span class="sm">US highways</span>');
const hhmm=h=>{h=((h%24)+24)%24;return String(Math.floor(h)).padStart(2,'0')+':'+(h%1<.5?'00':'30')};
// ---------- state ----------
let S;
function newState(){return{v:2,heat:0,safety:100,cash:1500,trucks:[],jobs:[],earned:0,last:Date.now(),fuel:3.9,clock:6}}
function mkTruck(c){return{id:rid(),name:'Rig #'+(S.trucks.length+1),at:c,job:null,prog:0,phase:'idle',rest:0,hos:0,auto:false,up:{fuel:0,speed:0,cap:0},cond:100,policy:'ask',type:'dry'}}
function genJob(from){const k=Object.keys(CITIES),f=from||pick(k);let t;do t=pick(k);while(t==f);
 const ty=pick(ENABLED_TYPES),r=route(f,t),mi=r.mi,w=Math.round(rnd(18,45))*1000;
 const rpm=rnd(2.1,3.1)*(mi<400?1.25:1)*TYPES[ty].m*(1+(w-30000)/300000);
 return{id:rid(),from:f,to:t,type:ty,miles:mi,via:r.via,w,pay:Math.round(mi*rpm)}}
function refill(){const k=Object.keys(CITIES);for(const c of k){let n=S.jobs.filter(j=>j.from==c).length;while(n++<2)S.jobs.push(genJob(c))}}
const truckSpeed=t=>SPEED*(1+.25*t.up.speed), mpg=(t,w=0)=>6.8*(1+.12*t.up.fuel)*(1-Math.max(0,w-20000)/250000), payMul=t=>1+.15*t.up.cap;
function profit(t,j){const dh=dist(t.at,j.from);const fuel=dh/mpg(t)*S.fuel+j.miles/mpg(t,j.w)*S.fuel,sm=j.type=='dry'?1:.5+.5*(S.safety??100)/100;return{dh,fuel:Math.round(fuel),net:Math.round(j.pay*payMul(t)*sm-fuel)}}
function assign(t,j){if(!t||!j||t.phase!='idle')return;const p=profit(t,j);t.job={...j,dh:p.dh,net:p.net,fuel:p.fuel};t.prog=0;t.phase=p.dh?'deadhead':'loading';if(!p.dh)startDock(t,'loading');
 S.jobs=S.jobs.filter(x=>x.id!=j.id);refill();drawRoutes();render()}
function startDock(t,ph){t.phase=ph;const n=1+(Math.random()*10|0);t.roll=n;t.rest=n*HR;if(!offline)diceToast(t,n,ph=='loading'?'to get loaded':'to get unloaded')}
const DIE=['⚀','⚁','⚂','⚃','⚄','⚅'];
function diceToast(t,n,what){let i=0;const iv=setInterval(()=>{toast(`🎲 ${t.name} rolling… ${DIE[i%6]} ${1+(Math.random()*10|0)}`,900);if(++i>7){clearInterval(iv);toast(`🎲 ${t.name} rolled a ${n}! ${n}h at the dock ${what}${n>=9?' 😩':n<=2?' 🙌':''}`,3000)}},90)}
function legRoute(t){if(!t.job)return null;const ph=t.phase=='rest'?t.prevPhase:t.phase;if(ph=='deadhead')return route(t.at,t.job.from);if(['loaded','weigh','scale','oos'].includes(ph))return route(t.job.from,t.job.to);return null}
function truckLL(t){const r=legRoute(t);if(r)return along(r,t.prog);const c=t.phase=='unloading'?t.job.to:t.phase=='loading'?t.job.from:t.at;return CITIES[c]}
// ---------- sim ----------
let offline=false;const say=m=>offline||toast(m,3500);
function deliver(t){const j=t.job;let g=j.net;g=offline?Math.round(g*.5):g;
 t.cond=Math.max(0,(t.cond??100)-4);S.cash+=g;S.earned+=g;t.at=j.to;
 if(!offline)pop('+'+fmt(g));
 t.job=null;t.phase='idle';t.prog=0;t.wsDone=0;drawRoutes()}
function tick(dt){S.clock=(S.clock+dt/HR)%24;
 for(const t of S.trucks){
  if(t.phase=='rest'){t.rest-=dt;if(t.rest<=0){t.phase=t.job?t.prevPhase:'idle';t.hos=0}continue}
  if(t.phase=='idle'){if(t.auto){let best=null,bn=0;for(const j of S.jobs){const n=profit(t,j).net/(dist(t.at,j.from)+j.miles+300);if(n>bn){bn=n;best=j}}if(best)assign(t,best)}continue}
  if(t.phase=='loading'||t.phase=='unloading'){t.rest-=dt;if(t.rest<=0){if(t.phase=='loading'){t.phase='loaded';t.prog=0;t.at=t.job.from}else deliver(t)}continue}
  if(t.phase=='scale'){t.scaleT-=dt;const c=document.getElementById('cd'+t.id);if(c)c.textContent=Math.ceil(t.scaleT);if(t.scaleT<=0)scaleChoose(t.id,t.policy=='blow'?'blow':t.policy=='random'?(Math.random()<.5?'blow':'pull'):'pull',1);continue}
  if(t.phase=='oos'){t.rest-=dt;if(t.rest<=0)t.phase=t.job?'loaded':'idle';continue}
  if(t.phase=='weigh'){t.rest-=dt;if(t.rest<=0)t.phase='loaded';continue}
  const len=Math.max(1,t.phase=='deadhead'?t.job.dh:t.job.miles),mv=truckSpeed(t)*dt;t.prog+=mv/len;t.hos+=mv/(truckSpeed(t)*HR);
  if(t.hos>=11){t.prevPhase=t.phase;t.phase='rest';t.rest=10*HR;say(`😴 ${t.name} out of hours — 10-hr break at a truck stop`)}
  if(t.phase=='loaded'&&!t.wsDone&&t.prog>.4){t.wsDone=1;if(Math.random()<.5){const pol=t.policy||'ask';if(!offline){t.phase='scale';t.scaleT=pol=='ask'?12:6;if(document.getElementById('modal').style.display!='flex')askScale(t)}else scaleDo(t,pol=='blow'||(pol=='random'&&Math.random()<.5)?'blow':'pull')}}
  if(t.prog>=1){if(t.phase=='deadhead'){t.at=t.job.from;t.prog=0;startDock(t,'loading');drawRoutes()}else if(t.phase=='loaded'){t.prog=1;startDock(t,'unloading')}}
 }
 S.heat=Math.max(0,(S.heat||0)-dt*.3);S.safety=Math.min(100,(S.safety??100)+dt*.02);
 S.fuel=Math.max(3,Math.min(5.2,S.fuel+(Math.random()-.5)*.02*dt));
}
function scaleDo(t,c){t.phase='loaded';const cond=t.cond??100,w=t.job?t.job.w:30000;
 if(c=='pull'){t.phase='weigh';t.rest=2;S.heat=Math.max(0,S.heat-10);
  if(Math.random()<(100-cond)/120){const f=150+Math.round((100-cond)*5);S.cash-=f;say(`⚖️ ${t.name}: DOT found a busted marker light. −${fmt(f)} (fix your rig, partner)`)}
  else say(pick([`⚖️ Green light! ${t.name} keeps truckin'`,`⚖️ Scale master waved ${t.name} through 👍`,`⚖️ ${t.name} weighed in at ${(w+35000).toLocaleString()} lbs gross. Legal!`]))}
 else{const caught=Math.random()<.1+S.heat/110;S.heat=Math.min(100,S.heat+25);
  if(caught){const f=2500+Math.round(S.heat*40);S.cash-=f;S.safety=Math.max(0,S.safety-15);t.phase='oos';t.rest=20;say(`🚔 Smokey caught ${t.name} blowing the scale! −${fmt(f)}, out of service, safety score dropped`)}
  else say(pick([`💨 ${t.name} blew right past the scale. Bear was napping 😏`,`💨 Scale was open… ${t.name} didn't notice. Heat rising 🔥`,`💨 ${t.name}: "What scale?"`]))}}
const POL={ask:'Ask each time',pull:'Always pull in',blow:'Always blow it',random:'🎲 Random'};
function askScale(t){const m=document.getElementById('modal');m.innerHTML=`<div class="card" style="max-width:340px"><h3>⚖️ Scale ahead — OPEN!</h3><p class="sm">Policy: <b>${POL[t.policy||'ask']}</b> — auto in <b id="cd${t.id}">${Math.ceil(t.scaleT||6)}</b>s</p><p>${t.name} is coming up on a DOT weigh station. Cargo ${(t.job?t.job.w:0).toLocaleString()} lb · Condition ${Math.round(t.cond??100)}% · Heat ${Math.round(S.heat)}%</p>
<button class="b" style="width:100%;margin:4px 0" onclick="scaleChoose('${t.id}','pull')">✅ Pull in (safe, short stop)</button><button class="b" style="width:100%;margin:4px 0;background:#e55" onclick="scaleChoose('${t.id}','blow')">💨 Blow the scale (${Math.round(10+S.heat/1.1)}% caught)</button></div>`;m.style.display='flex'}
function scaleChoose(id,c,auto){const t=S.trucks.find(x=>x.id==id);if(!t||t.phase!='scale')return;document.getElementById('modal').style.display='none';if(auto)say(`⏱️ ${t.name} went with ${t.policy=='random'?'🎲 the coin flip':'policy'}: ${c=='blow'?'blowing it':'pulling in'}`);t.phase='weigh';t.rest=99;setTimeout(()=>scaleDo(t,c),auto?1200:0);const n=S.trucks.find(x=>x.phase=='scale');if(n)askScale(n);render()}
// ---------- save / migrate ----------
function load(){try{S=JSON.parse(localStorage.getItem('idletruck'))}catch(e){}
 if(!S)S=newState();
 if((S.v||1)<2){S.v=2;S.clock=6;S.jobs=[];for(const t of S.trucks){t.type='dry';t.hos=(t.hos||0)/60;if(t.job){Object.assign(t.job,{type:'dry',w:t.job.w||30000,via:route(t.job.from,t.job.to).via})}}}
 S.jobs=S.jobs.filter(j=>ENABLED_TYPES.includes(j.type)&&CITIES[j.from]&&CITIES[j.to]);
 for(const t of S.trucks){if(t.phase=='weigh'&&t.rest>10)t.rest=2;if(t.phase=='scale'){t.phase='loaded'}}
 if(!S.trucks.length)S.trucks.push(mkTruck('DAL'));refill();
 const away=Math.min((Date.now()-S.last)/1000,4*3600);if(away>10){const c0=S.cash;offline=true;for(let i=0;i<away;i+=1)tick(1);offline=false;const g=S.cash-c0;if(g>0)setTimeout(()=>toast(`🌙 While you were away (${Math.round(away/60)} min) your fleet earned ${fmt(g)}!`,5000),300)}}
const save=()=>{S.last=Date.now();localStorage.setItem('idletruck',JSON.stringify(S))};
const truckCost=()=>Math.round(25000*Math.pow(1.9,S.trucks.length-1)), driverCost=()=>15000, upCost=(t,k)=>Math.round(5000*Math.pow(2.2,t.up[k]));
function toast(m,ms=2500){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)}
function pop(txt){const e=document.createElement('div');e.className='pop';e.textContent=txt;e.style.left=(30+Math.random()*40)+'%';e.style.top='70px';document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}
// ---------- map ----------
load();
const map=L.map('map',{zoomControl:false,preferCanvas:true,worldCopyJump:false,minZoom:3,maxZoom:17}).setView([37.5,-96],4);
L.control.zoom({position:'bottomright'}).addTo(map);
const sat=L.layerGroup([L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:17,attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community'}),
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:17,attribution:'Labels &copy; Esri'})]);
const roads=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'});
sat.addTo(map);L.control.layers({'🛰️ Satellite':sat,'🛣️ Roads':roads},null,{position:'topright',collapsed:false}).addTo(map);
map.attributionControl.addAttribution('Routes: OSRM / &copy; OpenStreetMap contributors');
let cityFilter=null,follow=null;
for(const k in CITIES){const[la,ln,n]=CITIES[k];L.circleMarker([la,ln],{radius:8,color:'#111',weight:2,fillColor:'#f5a623',fillOpacity:1}).addTo(map).bindTooltip(n,{permanent:true,direction:'bottom',className:'city',offset:[0,6]})
 .on('click',()=>{cityFilter=k;follow=null;setTab('jobs');map.flyTo([la,ln],Math.max(map.getZoom(),10),{duration:1})})}
const netLayer=L.layerGroup().addTo(map),actLayer=L.layerGroup().addTo(map),TM={};
function drawRoutes(){actLayer.clearLayers();for(const t of S.trucks){const r=legRoute(t)||(t.job&&t.phase=='loading'?route(t.job.from,t.job.to):null);if(r)L.polyline(r.pts,{color:t.id==follow?'#ffdd00':'#f5a623',weight:4,opacity:.9}).addTo(actLayer)}}
function drawTrucks(){for(const t of S.trucks){let m=TM[t.id];const ll=truckLL(t);const e=t.phase=='rest'?'😴':t.phase=='oos'?'🚫':['loading','unloading'].includes(t.phase)?'🏭':'🚚';
 if(!m){m=TM[t.id]=L.marker(ll,{icon:L.divIcon({className:'',html:'',iconSize:[28,28]}),zIndexOffset:1000}).addTo(map).on('click',()=>{follow=t.id;toast('📍 Following '+t.name);map.setView(truckLL(t),Math.max(map.getZoom(),8));drawRoutes()})}
 const key=e+(t.id==follow);if(m._k!=key){m._k=key;m.setIcon(L.divIcon({className:'',html:`<div class="truck${t.id==follow?' f':''}">${e}</div>`,iconSize:[28,28],iconAnchor:[14,14]}))}
 m.setLatLng(ll)}
 if(follow){const t=S.trucks.find(x=>x.id==follow);if(t)map.panTo(truckLL(t),{animate:false})}}
map.on('dragstart',()=>{if(follow){follow=null;drawRoutes();drawTrucks()}});
drawRoutes();
// ---------- UI ----------
function setTab(t){tab=t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t==t));render()}
let tab='jobs';document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
let sel=null;
const status=t=>{const j=t.job;return{idle:'🅿️ Parked at '+CITIES[t.at][2],deadhead:'↪️ Deadhead to '+(j&&CITIES[j.from][2]),loading:`🏭 Loading at ${j&&CITIES[j.from][2]} — rolled ${t.roll||'?'} (${Math.ceil(t.rest/HR)}h left)`,unloading:`📥 Unloading at ${j&&CITIES[j.to][2]} — rolled ${t.roll||'?'} (${Math.ceil(t.rest/HR)}h left)`,loaded:'🛣️ Hauling to '+(j&&CITIES[j.to][2]),rest:`😴 10-hr break (${Math.ceil(t.rest/HR)}h left)`,weigh:'⚖️ At weigh station',scale:'⚖️ Waiting on you at the scale',oos:`🚫 Out of service ${Math.ceil(t.rest)}s`}[t.phase]};
const barW=t=>['rest','loading','unloading','oos'].includes(t.phase)?100:Math.min(1,t.prog)*100;
function jobCard(j,t){const p=t?profit(t,j):null;return`<div class="card"><div class="row"><b>${TYPES[j.type].e} ${CITIES[j.from][2]} → ${CITIES[j.to][2]}</b><span class="tag">${TYPES[j.type].n}</span></div>
 <div class="sm">${j.w.toLocaleString()} lb · ${j.miles} mi via ${viaHtml(j.via)}</div>
 <div class="row"><span class="sm">${p?`${p.dh} mi deadhead · fuel −$${p.fuel}<br>`:''}Rate ${fmt(j.pay)} ($${(j.pay/j.miles).toFixed(2)}/mi) ${p?`→ net <b style="color:${p.net>0?'#7CFC7C':'#f66'}">${fmt(p.net)}</b>`:''}</span>
 <button class="b" ${t?'':'disabled'} onclick="assign(S.trucks.find(x=>x.id=='${t&&t.id}'),S.jobs.find(x=>x.id=='${j.id}'))">Book</button></div></div>`}
function render(){const P=document.getElementById('panel');let h='';
 if(tab=='jobs'){const idle=S.trucks.filter(t=>t.phase=='idle');if(!sel||!idle.find(t=>t.id==sel))sel=idle[0]&&idle[0].id;const t=S.trucks.find(x=>x.id==sel&&x.phase=='idle');
  h+=`<div class="sm">🕐 ${hhmm(S.clock)} · Diesel $${S.fuel.toFixed(2)}/gal · ${t?'Dispatching '+t.name+' ('+CITIES[t.at][2]+')':'All trucks busy'}</div>`;
  if(idle.length>1)h+='<div>'+idle.map(x=>`<button class="b ${x.id==sel?'':'g'}" style="margin:3px" onclick="sel='${x.id}';render()">${x.name}</button>`).join('')+'</div>';
  h+=`<div class="row" style="margin-top:6px"><b>${cityFilter?'📍 '+CITIES[cityFilter][2]+' load board':'⭐ Best loads for you'}</b>${cityFilter?`<button class="b g" onclick="cityFilter=null;map.flyTo([37.5,-96],4);render()">All cities</button>`:'<span class="sm">Tap a city on the map</span>'}</div>`;
  let js=cityFilter?S.jobs.filter(j=>j.from==cityFilter):S.jobs.slice();if(t)js.sort((a,b)=>profit(t,b).net-profit(t,a).net);if(!cityFilter)js=js.slice(0,8);
  h+=js.map(j=>jobCard(j,t)).join('')}
 if(tab=='fleet')for(const t of S.trucks){h+=`<div class="card" onclick="follow='${t.id}';map.setView(truckLL(S.trucks.find(x=>x.id=='${t.id}')),8);drawRoutes()"><div class="row"><b>🚛 ${t.name}</b><span class="tag">${t.auto?'🤖 Driver hired':'👤 You dispatch'}</span></div>
  <div class="sm" data-st="${t.id}">${status(t)}</div>${t.job?`<div class="sm">${t.job.w.toLocaleString()} lb · via ${viaHtml(t.job.via)}</div>`:''}<div class="bar"><i data-pb="${t.id}" style="width:${barW(t)}%"></i></div>
  <div class="sm">HOS drive: <span data-hos="${t.id}">${t.hos.toFixed(1)}</span>/11 hr · ${mpg(t).toFixed(1)} mpg · pay ×${payMul(t).toFixed(2)} · tap to follow</div></div>`}
 if(tab=='shop'){h+=`<div class="card row"><span>🚛 Buy used rig + 53' van<br><span class="sm">More trucks = more loads</span></span><button class="b" ${S.cash<truckCost()?'disabled':''} onclick="buyTruck()">${fmt(truckCost())}</button></div>`;
  for(const t of S.trucks){h+=`<div class="card"><b>${t.name}</b> <span class="sm">Cond ${Math.round(t.cond??100)}%</span><div class="row"><span>⚖️ Scale policy</span><select onchange="S.trucks.find(x=>x.id=='${t.id}').policy=this.value">${Object.keys(POL).map(o=>`<option ${t.policy==o?'selected':''} value=${o}>${POL[o]}</option>`).join('')}</select></div><div class="row"><span>🔧 Repair to 100%</span><button class="b" ${S.cash<repCost(t)||t.cond>=100?'disabled':''} onclick="rep('${t.id}')">${fmt(repCost(t))}</button></div>${t.auto?'':`<div class="row"><span>🤖 Hire driver (auto-dispatch)</span><button class="b" ${S.cash<driverCost()?'disabled':''} onclick="hire('${t.id}')">${fmt(driverCost())}</button></div>`}
  ${[['fuel','⛽ Aero kit / fuel eff.'],['speed','⚡ Engine tune / speed'],['cap','💰 Better broker contacts / pay']].map(([k,n])=>`<div class="row" style="margin-top:4px"><span>${n} <span class="sm">Lv${t.up[k]}</span></span><button class="b" ${S.cash<upCost(t,k)?'disabled':''} onclick="upg('${t.id}','${k}')">${fmt(upCost(t,k))}</button></div>`).join('')}</div>`}
  h+=`<div class="sm" style="text-align:center;margin:12px"><a href="#" style="color:#888" onclick="if(confirm('Reset game?')){localStorage.removeItem('idletruck');location.reload()}">Reset save</a></div>`}
 P.innerHTML=h}
const repCost=t=>Math.round((100-(t.cond??100))*40);function rep(id){const t=S.trucks.find(x=>x.id==id),c=repCost(t);if(S.cash<c)return;S.cash-=c;t.cond=100;render()}
function buyTruck(){const c=truckCost();if(S.cash<c)return;S.cash-=c;S.trucks.push(mkTruck('DAL'));toast('🎉 New rig added to your fleet!');render()}
function hire(id){if(S.cash<driverCost())return;S.cash-=driverCost();S.trucks.find(t=>t.id==id).auto=true;toast('🤖 Driver hired — this truck books its own loads');render()}
function upg(id,k){const t=S.trucks.find(t=>t.id==id),c=upCost(t,k);if(S.cash<c)return;S.cash-=c;t.up[k]++;render()}
render();let lastT=performance.now(),acc=0,shown=S.cash,sv=0,mt=0;
function loop(now){const dt=Math.min(.5,(now-lastT)/1000);lastT=now;const before=S.trucks.map(t=>t.phase).join();tick(dt);
 shown+=(S.cash-shown)*Math.min(1,dt*8);document.getElementById('cash').textContent=fmt(Math.abs(S.cash-shown)<1?S.cash:shown);
 document.getElementById('rate').textContent=`Lifetime ${fmt(S.earned)} · 🔥${Math.round(S.heat||0)} 🛡️${Math.round(S.safety??100)} · ${S.trucks.length} truck${S.trucks.length>1?'s':''}`;
 document.getElementById('lvl').textContent=['Owner-Op','Small Fleet','Regional Carrier','National Carrier'][Math.min(3,Math.floor(S.trucks.length/3))];
 if((mt+=dt)>.1){mt=0;drawTrucks()}
 const changed=before!=S.trucks.map(t=>t.phase).join();if(changed)drawRoutes();
 if(changed||(acc+=dt)>1){acc=0;if(tab=='jobs'||(tab=='shop'&&document.activeElement.tagName!='SELECT')||(tab=='fleet'&&changed))render()}
 if(tab=='fleet')for(const t of S.trucks){const b=document.querySelector(`[data-pb="${t.id}"]`);if(b){b.style.width=barW(t)+'%';document.querySelector(`[data-st="${t.id}"]`).textContent=status(t);document.querySelector(`[data-hos="${t.id}"]`).textContent=t.hos.toFixed(1)}}
 if((sv+=dt)>3){sv=0;save()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);addEventListener('visibilitychange',save);addEventListener('pagehide',save);
</script></body></html>
